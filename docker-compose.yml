services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pmai
      POSTGRES_PASSWORD: pmai
      POSTGRES_DB: pmai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
